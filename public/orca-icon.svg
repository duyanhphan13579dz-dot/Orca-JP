    stroke-linecap="round"
  />
  <!-- Ocean Cyan Wave highlight on Orca back -->
  <path
    d="M 28 14 C 40 9 60 9 74 15 C 86 21 92 33 92 48"
    stroke="#06B6D4"
    stroke-width="4"
    stroke-linecap="round"
  />
